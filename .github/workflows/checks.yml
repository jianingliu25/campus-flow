name: Fictional preview checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  preview:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python scripts/manage.py setup
      - run: python scripts/manage.py validate
      - run: python scripts/manage.py test
      - run: git diff --exit-code -- fixtures/schemas
